name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify source manifest
        run: sha256sum -c SOURCE_MANIFEST.sha256

      - name: Run tests
        run: python -m pytest -q

      - name: CLI help smoke
        run: python -m cineswarm --help
