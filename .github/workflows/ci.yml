name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg and FFprobe
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using the runner's existing FFmpeg and FFprobe binaries."
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify source manifest
        run: sha256sum -c SOURCE_MANIFEST.sha256

      - name: Run tests
        run: python -m pytest -q

      - name: CLI help smoke
        run: python -m cineswarm --help
