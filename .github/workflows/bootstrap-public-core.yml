name: Bootstrap CineSwarm Public Core

on:
  push:
    branches:
      - release/v0.2.0-public-core
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-public-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/release/v0.2.0-public-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.0-public-core
          fetch-depth: 0

      - name: Reconstruct audited source archive
        run: |
          cat bootstrap/part-*.bin > /tmp/cineswarm-core.tar.gz
          echo "0ac737ae8144b54727fc36df03a8b49930efb03fee198c94394d0613fe19cd28  /tmp/cineswarm-core.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cineswarm-core.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-public-core.yml

      - name: Verify imported tree
        run: |
          sha256sum -c SOURCE_MANIFEST.sha256
          python -m pip install -e . pytest
          python -m pytest -q

      - name: Commit exact public core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import CineSwarm v0.2.0 public core"
          git push origin HEAD:release/v0.2.0-public-core
