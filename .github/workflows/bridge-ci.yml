name: CineSwarm Bridge CI

on:
  push:
    branches: [main]
    paths:
      - "packages/cineswarm-bridge/**"
      - "scripts/**"
      - "fixtures/cineswarm/**"
      - "proof/**"
      - "docs/CINESWARM_*.md"
      - "provenance/c1-24h/**"
      - "C1_*.json"
      - "CANONICAL_STATUS_C1_24G.json"
      - "BRIDGE_SOURCE_MANIFEST.sha256"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
    paths:
      - "packages/cineswarm-bridge/**"
      - "scripts/**"
      - "fixtures/cineswarm/**"
      - "proof/**"
      - "docs/CINESWARM_*.md"
      - "provenance/c1-24h/**"
      - "C1_*.json"
      - "CANONICAL_STATUS_C1_24G.json"
      - "BRIDGE_SOURCE_MANIFEST.sha256"
      - ".github/workflows/bridge-ci.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify bridge source manifest
        run: sha256sum -c BRIDGE_SOURCE_MANIFEST.sha256

      - name: Run bridge suite
        run: npm test --prefix packages/cineswarm-bridge

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find packages/cineswarm-bridge scripts provenance/c1-24h/handoff -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate imported JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [
              Path("packages/cineswarm-bridge"),
              Path("fixtures/cineswarm"),
              Path("proof"),
              Path("provenance/c1-24h"),
          ]
          count = 0
          for root in roots:
              for path in root.rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  count += 1
          for path in Path(".").glob("C1_*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              count += 1
          path = Path("CANONICAL_STATUS_C1_24G.json")
          if path.exists():
              json.loads(path.read_text(encoding="utf-8"))
              count += 1
          print(f"validated {count} JSON objects")
          PY
