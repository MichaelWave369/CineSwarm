name: Bootstrap CineSwarm Public Source

on:
  push:
    branches:
      - main
      - release/v0.2.0-public-source
    paths:
      - bootstrap/cineswarm-public-source.tar.gz
      - .github/workflows/bootstrap-public-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/release/v0.2.0-public-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.0-public-source
          fetch-depth: 0

      - name: Expand audited public source tree
        run: |
          test -f bootstrap/cineswarm-public-source.tar.gz
          tar -xzf bootstrap/cineswarm-public-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-public-source.yml

      - name: Commit promoted public source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import CineSwarm v0.2.0 public source"
          git push origin HEAD:release/v0.2.0-public-source
